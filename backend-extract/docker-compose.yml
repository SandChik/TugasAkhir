services:
  api:
    build: .
    image: be-automation-api
    container_name: be-automation-api
    ports:
      - "8000:8000"
    # Muat API_KEY, ROUTER_API_KEY, ALLOWED_ORIGINS, BASE_URL, MODEL dari .env
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
